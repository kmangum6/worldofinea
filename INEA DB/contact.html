<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact</title>
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <div id="nav"></div>
        <header class="page-banner">
        <h1>Contact Us</h1>
        <p>Questions about the game, the rules, or your first event? Send us a message.</p>
        </header>
 
        <main>
            <section class="contact">
                <form id="contact-form" class="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
 
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
 
                    <label for="topic">Topic</label>
                    <select id="topic" name="topic">
                        <option>General question</option>
                        <option>Rules question</option>
                        <option>Character or story question</option>
                        <option>Logistics</option>
                        <option>Other</option>
                    </select>
 
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea><br>
 
                    <button class="btn" type="submit">Send Message</button>
                    <p id="contact-status" role="status"></p>
                </form>
            </section>
        </main>
 
        <div id="footer"></div>
 
        <script src="js/shared.js"></script>
        <script src="js/contact.js"></script>
    </body>
</html>
